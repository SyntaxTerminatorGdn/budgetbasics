<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="beeBodyGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <linearGradient id="beeWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Wings -->
  <g opacity="0.9">
    <ellipse cx="40" cy="38" rx="20" ry="12" transform="rotate(-30 40 38)" fill="url(#beeWingGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <ellipse cx="80" cy="38" rx="20" ry="12" transform="rotate(30 80 38)" fill="url(#beeWingGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Wing veining detail -->
    <path d="M35 42 Q42 35 48 36" stroke="#0284C7" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M85 42 Q78 35 72 36" stroke="#0284C7" stroke-width="1" fill="none" opacity="0.6"/>
  </g>

  <!-- Mascot Body -->
  <ellipse cx="60" cy="68" rx="32" ry="36" fill="url(#beeBodyGrad)" filter="url(#softGlow)"/>

  <!-- Stripes -->
  <path d="M34 60 Q60 68 86 60 Q84 70 60 76 Q36 70 34 60 Z" fill="#1E293B"/>
  <path d="M38 80 Q60 88 82 80 Q78 92 60 96 Q42 92 38 80 Z" fill="#1E293B"/>

  <!-- Stinger -->
  <path d="M57 103 L60 110 L63 103 Z" fill="#1E293B"/>

  <!-- Head -->
  <circle cx="60" cy="42" r="20" fill="#1E293B"/>

  <!-- Antennae -->
  <path d="M53 25 Q45 12 36 17" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="36" cy="17" r="4" fill="#F59E0B"/>
  <path d="M67 25 Q75 12 84 17" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="84" cy="17" r="4" fill="#F59E0B"/>

  <!-- Friendly Eyes -->
  <ellipse cx="53" cy="40" rx="4.5" ry="5.5" fill="#FFFFFF"/>
  <circle cx="54" cy="40" r="2.8" fill="#0D9488"/>
  <circle cx="55" cy="38.5" r="1.2" fill="#FFFFFF"/>

  <ellipse cx="67" cy="40" rx="4.5" ry="5.5" fill="#FFFFFF"/>
  <circle cx="66" cy="40" r="2.8" fill="#0D9488"/>
  <circle cx="67" cy="38.5" r="1.2" fill="#FFFFFF"/>

  <!-- Cheerful Smile -->
  <path d="M55 50 Q60 56 65 50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Rosy Cheeks -->
  <circle cx="48" cy="48" r="3" fill="#F43F5E" opacity="0.5"/>
  <circle cx="72" cy="48" r="3" fill="#F43F5E" opacity="0.5"/>

  <!-- Holding Gold Savings Coin -->
  <g transform="translate(60, 85)">
    <circle cx="0" cy="0" r="14" fill="#FCD34D" stroke="#B45309" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="11" fill="none" stroke="#D97706" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="15" fill="#78350F" text-anchor="middle">$</text>
  </g>
</svg>
