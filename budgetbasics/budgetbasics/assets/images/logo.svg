<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="beeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD026" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0D9488" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Mascot Icon Group -->
  <g transform="translate(10, 8)">
    <!-- Shield / Hexagon Honeycomb Background -->
    <path d="M32 4 L56 18 L56 46 L32 60 L8 46 L8 18 Z" fill="url(#tealGrad)" filter="url(#glow)" />
    
    <!-- Bee Wings -->
    <ellipse cx="23" cy="22" rx="10" ry="6" transform="rotate(-35 23 22)" fill="url(#wingGrad)" />
    <ellipse cx="41" cy="22" rx="10" ry="6" transform="rotate(35 41 22)" fill="url(#wingGrad)" />

    <!-- Bee Body -->
    <ellipse cx="32" cy="34" rx="14" ry="17" fill="url(#beeGold)" />
    
    <!-- Bee Stripes -->
    <path d="M20 31 Q32 35 44 31 Q43 36 41 39 Q32 43 23 39 Z" fill="#1F2937" />
    <path d="M22 42 Q32 45 42 42 Q40 46 32 49 Q24 46 22 42 Z" fill="#1F2937" />
    
    <!-- Bee Head & Antennae -->
    <circle cx="32" cy="21" r="8" fill="#1F2937" />
    <path d="M28 15 Q25 9 20 11" stroke="#1F2937" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="20" cy="11" r="1.5" fill="#FFD026" />
    <path d="M36 15 Q39 9 44 11" stroke="#1F2937" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="44" cy="11" r="1.5" fill="#FFD026" />
    
    <!-- Bee Eyes -->
    <circle cx="29" cy="20" r="1.8" fill="#FFFFFF" />
    <circle cx="35" cy="20" r="1.8" fill="#FFFFFF" />
    <circle cx="29.5" cy="20" r="0.8" fill="#0D9488" />
    <circle cx="35.5" cy="20" r="0.8" fill="#0D9488" />

    <!-- Coin in hands -->
    <circle cx="32" cy="48" r="5" fill="#FFD700" stroke="#B45309" stroke-width="1.2" />
    <text x="32" y="51.5" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="900" fill="#78350F" text-anchor="middle">$</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(85, 20)">
    <!-- Main Title -->
    <text x="0" y="27" font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="28" fill="#0F172A">
      Budget<tspan fill="#0D9488">Basics</tspan>
    </text>
    <!-- Mascot Tagline -->
    <text x="0" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#F59E0B" letter-spacing="1.5">
      NEXTGEN BUDGETBEE
    </text>
    <!-- Dot / Accent -->
    <circle cx="152" cy="41" r="2.5" fill="#0D9488" />
    <text x="160" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="10.5" fill="#64748B">
      Financial Literacy for Students
    </text>
  </g>
</svg>
